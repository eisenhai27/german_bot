<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Deutsch Pass</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EFE4; --surface:#FBF8F1; --surface-2:#EDE6D6; --ink:#1E2230; --muted:#6B6F80;
    --line:rgba(30,34,48,.12); --line-strong:rgba(30,34,48,.22);
    --brand:#7A2233; --brand-soft:rgba(122,34,51,.12); --on-brand:#FFF7EC;
    --gold:#E3C47F; --cover-a:#8A2A3C; --cover-b:#561423;
    --ok:#2F7D55; --ok-bg:#E1F0E6; --bad:#B23A48; --bad-bg:#F7E1E3;
    --der:#2F63C9; --die:#C8374A; --das:#23905E;
    --shadow:0 1px 2px rgba(30,34,48,.06), 0 10px 28px -14px rgba(30,34,48,.25);
    --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141B; --surface:#1B1E28; --surface-2:#262A38; --ink:#F1ECE2; --muted:#9A9EB0;
      --line:rgba(241,236,226,.1); --line-strong:rgba(241,236,226,.2);
      --brand:#E07A8C; --brand-soft:rgba(224,122,140,.14); --on-brand:#1B0E12;
      --ok:#6BC794; --ok-bg:#16291F; --bad:#EF8290; --bad-bg:#33181D;
      --der:#86A9F5; --die:#F28B97; --das:#6FD1A1;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141B; --surface:#1B1E28; --surface-2:#262A38; --ink:#F1ECE2; --muted:#9A9EB0;
    --line:rgba(241,236,226,.1); --line-strong:rgba(241,236,226,.2);
    --brand:#E07A8C; --brand-soft:rgba(224,122,140,.14); --on-brand:#1B0E12;
    --ok:#6BC794; --ok-bg:#16291F; --bad:#EF8290; --bad-bg:#33181D;
    --der:#86A9F5; --die:#F28B97; --das:#6FD1A1;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:15px/1.45 var(--sans); -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
  }
  button{font:inherit; color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none;}

  #app{max-width:560px; margin:0 auto; min-height:100vh; padding-top:env(safe-area-inset-top,0px);}
  .view{padding:16px 16px 48px; animation:viewIn .28s ease both;}
  .view.docked{padding-bottom:180px;}
  @keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---------- top bar ---------- */
  .top{display:flex; align-items:center; gap:12px; min-height:44px; margin-bottom:14px;}
  .top h1{font:600 19px/1.2 var(--serif); margin:0;}
  .top .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .top .grow{flex:1; min-width:0;}
  .iconbtn{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
    display:grid; place-items:center; flex:none;
  }
  .tg .iconbtn.back{display:none;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:99px; background:var(--surface); border:1px solid var(--line); font-size:12.5px; font-weight:600; white-space:nowrap;}
  .chip.ok{color:var(--ok);}

  /* ---------- passport cover ---------- */
  .cover{
    position:relative; overflow:hidden; border-radius:22px; padding:20px 20px 16px; color:var(--gold);
    background:
      repeating-radial-gradient(circle at 115% -20%, rgba(255,255,255,.06) 0 1px, transparent 1px 8px),
      repeating-radial-gradient(circle at -20% 130%, rgba(255,255,255,.04) 0 1px, transparent 1px 10px),
      linear-gradient(150deg,var(--cover-a),var(--cover-b));
    box-shadow:0 18px 40px -22px rgba(86,20,35,.9), inset 0 0 0 1px rgba(255,255,255,.06);
    margin-bottom:14px;
  }
  .cover::after{ /* gold foil sheen */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,235,190,.12) 50%,transparent 65%);
    background-size:250% 100%; animation:sheen 6s ease-in-out infinite;
  }
  @keyframes sheen{0%,60%{background-position:120% 0;} 100%{background-position:-120% 0;}}
  .cover-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .cover-kicker{font:600 10.5px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase; opacity:.85;}
  .cover-title{font:600 27px/1.1 var(--serif); margin-top:8px; color:#F6E7C4;}
  .cover-emblem{width:46px; height:46px; border-radius:50%; border:1.5px solid rgba(227,196,127,.6); display:grid; place-items:center; font:700 15px var(--serif);}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0 14px;}
  .stat b{display:block; font:600 24px/1 var(--serif); color:#FBEFD2;}
  .stat span{font-size:11.5px; opacity:.8;}
  .cover-bar{height:6px; border-radius:99px; background:rgba(0,0,0,.25); overflow:hidden;}
  .cover-bar i{display:block; height:100%; background:linear-gradient(90deg,#C9A45C,#F3D995); border-radius:inherit;}
  .mrz{margin-top:14px; font:500 10.5px/1.5 var(--mono); letter-spacing:.14em; opacity:.55; white-space:nowrap; overflow:hidden;}

  /* ---------- continue card ---------- */
  .continue{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left;
    padding:14px 16px; border-radius:18px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow);
    margin-bottom:22px;
  }
  .continue .num{width:48px; height:48px; border-radius:50%; border:2px solid var(--brand); color:var(--brand); display:grid; place-items:center; font:600 20px var(--serif); flex:none;}
  .continue .k{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--brand);}
  .continue .t{font:600 16px/1.3 var(--serif); margin:2px 0;}
  .continue .s{font-size:12.5px; color:var(--muted);}
  .continue .grow{flex:1; min-width:0;}

  /* ---------- stamp map ---------- */
  .module{margin-bottom:18px;}
  .module-label{display:flex; align-items:center; gap:10px; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
  .module-label::after{content:""; flex:1; height:1px; background:var(--line);}
  .stamps{display:grid; grid-template-columns:repeat(3,minmax(0,118px)); justify-content:space-around; gap:14px;}
  .stamp{
    aspect-ratio:1; border-radius:50%; position:relative; display:grid; place-items:center; align-content:center; gap:3px;
    background:var(--surface); border:1.5px dashed var(--line-strong); color:var(--muted); padding:0;
    transition:transform .15s ease;
  }
  .stamp:active{transform:scale(.94);}
  .stamp .n{font:600 26px/1 var(--serif);}
  .stamp small{font:700 8.5px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase;}
  .stamp.locked{opacity:.55;}
  .stamp.open{border:2px solid var(--brand); color:var(--brand); box-shadow:0 0 0 5px var(--brand-soft);}
  .stamp.current{animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px var(--brand-soft);} 50%{box-shadow:0 0 0 10px transparent;}}
  .stamp.passed{border:none; color:var(--ok); background:var(--ok-bg); transform:rotate(var(--rot,-6deg));}
  .stamp.passed::before, .stamp.passed::after{content:""; position:absolute; border-radius:50%; border:2px solid currentColor; pointer-events:none;}
  .stamp.passed::before{inset:5px; opacity:.9;}
  .stamp.passed::after{inset:11px; border-width:1px; border-style:dashed; opacity:.55;}

  .foot{text-align:center; font-size:12px; color:var(--muted); padding:10px 0 0;}
  .linkbtn{background:none; border:none; color:var(--muted); text-decoration:underline; font-size:12px; padding:6px;}

  /* ---------- lektion ---------- */
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
  .section-label{font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:4px 0 10px;}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
  .tile{
    position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-height:112px;
    padding:14px; border-radius:16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow);
    text-align:left; transition:transform .12s ease;
  }
  .tile:active{transform:scale(.97);}
  .tile:disabled{opacity:.5; box-shadow:none; cursor:default;}
  .tile:last-child:nth-child(odd){grid-column:1 / -1; min-height:0; flex-direction:row; align-items:center;}
  .tile .ic{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand);}
  .tile b{font-size:15px; font-weight:600; line-height:1.2;}
  .tile span{font-size:12px; color:var(--muted); line-height:1.3;}
  .tile .badge{position:absolute; top:12px; right:12px; min-width:22px; padding:2px 7px; border-radius:99px; background:var(--bad); color:#fff; font-size:11.5px; font-weight:700; text-align:center;}
  .exam{
    width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:18px; border:none; border-radius:18px; color:#F6E7C4;
    background:repeating-radial-gradient(circle at 110% 0%, rgba(255,255,255,.06) 0 1px, transparent 1px 8px), linear-gradient(150deg,var(--cover-a),var(--cover-b));
    box-shadow:0 16px 34px -20px rgba(86,20,35,.9);
  }
  .exam .grow{flex:1;}
  .exam b{display:block; font:600 18px/1.2 var(--serif);}
  .exam span{font-size:12.5px; opacity:.85;}
  .locked-panel{text-align:center; padding:34px 20px; border:1.5px dashed var(--line-strong); border-radius:18px; color:var(--muted);}
  .locked-panel svg{width:34px; height:34px; margin-bottom:10px;}
  .locked-panel p{margin:0 0 16px;}

  /* ---------- buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px 18px; border-radius:14px;
    border:1.5px solid var(--line-strong); background:var(--surface); font-weight:600; font-size:15.5px; transition:transform .1s ease;
  }
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:var(--on-brand);}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:var(--bg);}
  .btn.bad{background:var(--bad); border-color:var(--bad); color:var(--bg);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--muted); font-weight:500;}
  .btn + .btn{margin-top:10px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row2 .btn + .btn{margin-top:0;}

  /* ---------- quiz ---------- */
  .progress{display:flex; align-items:center; gap:10px; flex:1;}
  .bar{flex:1; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .bar i{display:block; height:100%; border-radius:inherit; background:var(--brand); transition:width .35s ease;}
  .prompt{
    position:relative; text-align:center; padding:30px 20px 26px; margin-bottom:16px;
    background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
  }
  .prompt .lbl{font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .prompt .word{font:600 28px/1.25 var(--serif); margin-top:10px; overflow-wrap:anywhere;}
  .prompt .word .blank{display:inline-block; min-width:62px; border-bottom:3px solid var(--line-strong); margin-right:8px; color:var(--brand);}
  .blank.der{color:var(--der);} .blank.die{color:var(--die);} .blank.das{color:var(--das);}
  .prompt .hint{margin-top:8px; font-size:14px; color:var(--muted);}
  .say{position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg); display:grid; place-items:center; color:var(--brand);}
  .opt{
    display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; margin-bottom:10px; text-align:left;
    border-radius:14px; border:1.5px solid var(--line); background:var(--surface); font-size:15.5px; font-weight:500; line-height:1.35;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:active{transform:scale(.99);}
  .opt kbd{width:26px; height:26px; border-radius:8px; border:1px solid var(--line-strong); display:grid; place-items:center; font:600 12px var(--sans); color:var(--muted); flex:none;}
  .opt.ok{border-color:var(--ok); background:var(--ok-bg);}
  .opt.ok kbd{border-color:var(--ok); color:var(--ok);}
  .opt.bad{border-color:var(--bad); background:var(--bad-bg); animation:shake .35s ease;}
  .opt.bad kbd{border-color:var(--bad); color:var(--bad);}
  .opt.dim{opacity:.5;}
  .opt:disabled{cursor:default;}
  .articles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .art{padding:20px 0; border-radius:16px; border:2px solid currentColor; background:var(--surface); font:600 22px var(--serif); transition:transform .1s ease;}
  .art:active{transform:scale(.96);}
  .art.der{color:var(--der);} .art.die{color:var(--die);} .art.das{color:var(--das);}
  .art.ok{background:currentColor;} .art.ok span{color:var(--bg);}
  .art.bad{opacity:.4; text-decoration:line-through; animation:shake .35s ease;}
  .art.dim{opacity:.35;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-3px);}}

  /* ---------- bottom dock (feedback / actions) ---------- */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -12px 30px -18px rgba(0,0,0,.35);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); animation:dockIn .25s ease both;
  }
  .dock-inner{max-width:528px; margin:0 auto;}
  @keyframes dockIn{from{transform:translateY(100%);} to{transform:none;}}
  .dock.ok{background:var(--ok-bg);} .dock.bad{background:var(--bad-bg);}
  .fb-title{display:flex; align-items:center; gap:8px; font:600 18px var(--serif); margin-bottom:4px;}
  .dock.ok .fb-title{color:var(--ok);} .dock.bad .fb-title{color:var(--bad);}
  .fb-text{font-size:14px; margin-bottom:12px; line-height:1.45;}
  .fb-text .note{display:block; margin-top:6px; color:var(--muted);}

  /* ---------- typing ---------- */
  .type-input{
    width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid var(--line-strong); background:var(--surface);
    color:var(--ink); font:500 22px var(--serif); outline:none; margin-bottom:10px;
  }
  .type-input:focus{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft);}
  .type-input.ok{border-color:var(--ok);} .type-input.bad{border-color:var(--bad);}
  .keys{display:flex; gap:8px; margin-bottom:6px;}
  .key{flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--line); background:var(--surface); font:600 17px var(--serif);}

  /* ---------- matching ---------- */
  .match{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .match-col{display:flex; flex-direction:column; gap:10px;}
  .mi{
    min-height:56px; padding:10px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface);
    font-size:14px; font-weight:500; line-height:1.3; text-align:center; overflow-wrap:anywhere; transition:all .15s ease;
  }
  .mi.de{font-family:var(--serif); font-weight:600; font-size:15px;}
  .mi.sel{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); transform:translateY(-1px);}
  .mi.done{border-color:var(--ok); background:var(--ok-bg); color:var(--ok); opacity:.6; animation:pop .3s ease;}
  .mi.wrong{border-color:var(--bad); background:var(--bad-bg); animation:shake .35s ease;}
  @keyframes pop{50%{transform:scale(1.06);}}
  .hint-line{font-size:13px; color:var(--muted); margin:0 0 14px;}

  /* ---------- flashcards ---------- */
  .dirbtn{height:40px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font:700 11.5px var(--sans); letter-spacing:.08em; flex:none;}
  .deck{position:relative; height:310px; margin:6px 0 16px; perspective:1400px;}
  .deck-card{
    position:absolute; inset:0; border-radius:24px; background:var(--surface); border:1px solid var(--line);
    transition:transform .35s ease, opacity .35s ease;
  }
  .deck-card.d1{transform:translateY(12px) scale(.95); opacity:.8;}
  .deck-card.d2{transform:translateY(24px) scale(.9); opacity:.5;}
  .swipe{position:absolute; inset:0; touch-action:pan-y; will-change:transform; z-index:2;}
  .swipe.enter{animation:rise .38s cubic-bezier(.2,.9,.3,1.15) both;}
  @keyframes rise{from{transform:translateY(12px) scale(.95); opacity:.8;}}
  .swipe.dragging{transition:none; cursor:grabbing;}
  .swipe.settle{transition:transform .35s cubic-bezier(.2,.9,.3,1.3);}
  .swipe.fly-right{transition:transform .3s ease-in, opacity .3s ease-in; transform:translateX(130%) rotate(20deg) !important; opacity:0;}
  .swipe.fly-left{transition:transform .3s ease-in, opacity .3s ease-in; transform:translateX(-130%) rotate(-20deg) !important; opacity:0;}
  .card{
    position:absolute; inset:0; transform-style:preserve-3d; cursor:pointer;
    transition:transform .65s cubic-bezier(.3,1.35,.45,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; border-radius:24px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:28px 24px;
  }
  .face.front{color:#F6E7C4; background:repeating-radial-gradient(circle at 110% 0%, rgba(255,255,255,.06) 0 1px, transparent 1px 8px), linear-gradient(150deg,var(--cover-a),var(--cover-b)); box-shadow:0 22px 44px -24px rgba(86,20,35,.95);}
  .face.back{transform:rotateY(180deg); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);}
  .face .w{font:600 32px/1.25 var(--serif); overflow-wrap:anywhere;}
  .face .sub-w{margin-top:12px; font-size:14.5px; color:var(--muted);}
  .face .lbl{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; opacity:.7; margin-bottom:12px;}
  .face .say{background:rgba(0,0,0,.18); border-color:rgba(255,255,255,.2); color:#F6E7C4;}
  .face.back .say{background:var(--bg); border-color:var(--line); color:var(--brand);}
  .face .tag{position:absolute; top:14px; left:14px; padding:3px 9px; border-radius:99px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:rgba(0,0,0,.2);}
  .face.back .tag{background:var(--surface-2);}
  .face .flip-cue{position:absolute; bottom:16px; left:0; right:0; font-size:12px; opacity:.6;}
  .g-m{color:var(--der);} .g-f{color:var(--die);} .g-n{color:var(--das);}
  .face.front .g-m{color:#A9C3FF;} .face.front .g-f{color:#FFB3BD;} .face.front .g-n{color:#9DE7C2;}
  .verdict{
    position:absolute; top:62px; z-index:3; padding:6px 12px; border:3px solid currentColor; border-radius:10px; pointer-events:none;
    font:700 17px var(--mono); letter-spacing:.18em; background:var(--surface); opacity:0;
  }
  .verdict.yes{left:20px; color:var(--ok); transform:rotate(-14deg); opacity:var(--yes,0);}
  .verdict.no{right:20px; color:var(--bad); transform:rotate(14deg); opacity:var(--no,0);}
  .flash-hint{text-align:center; font-size:12.5px; color:var(--muted);}
  .flash-dock{animation:none; transform:translateY(110%); transition:transform .32s cubic-bezier(.2,.9,.3,1.1);}
  .view.revealed + .flash-dock{transform:none;}
  .flash-dock .btn.again{color:var(--bad);}
  .kbd-hint{text-align:center; font-size:11.5px; color:var(--muted); margin-top:8px;}
  @media (hover:none){ .kbd-hint{display:none;} }

  /* ---------- result ---------- */
  .result{text-align:center; padding-top:8px;}
  .ring-wrap{position:relative; width:170px; height:170px; margin:6px auto 12px;}
  .ring{width:100%; height:100%; transform:rotate(-90deg);}
  .ring circle{fill:none; stroke-width:10; stroke-linecap:round;}
  .ring .track{stroke:var(--surface-2);}
  .ring .val{stroke:var(--brand); stroke-dasharray:326.73; animation:ringIn 1s cubic-bezier(.2,.8,.2,1) both;}
  .ring .val.ok{stroke:var(--ok);}
  @keyframes ringIn{from{stroke-dashoffset:326.73;}}
  .ring-label{position:absolute; inset:0; display:grid; place-items:center; align-content:center;}
  .ring-label b{font:600 38px/1 var(--serif);}
  .ring-label span{font-size:13px; color:var(--muted); margin-top:4px;}
  .seal{
    display:inline-block; margin:4px 0 12px; padding:6px 16px; border:3px double var(--ok); border-radius:8px; color:var(--ok);
    font:700 16px var(--mono); letter-spacing:.2em; transform:rotate(-5deg); animation:seal .5s cubic-bezier(.2,.9,.3,1.3) .5s both;
  }
  .seal.bad{border-color:var(--bad); color:var(--bad);}
  @keyframes seal{from{opacity:0; transform:scale(2.2) rotate(-12deg);} to{opacity:1; transform:scale(1) rotate(-5deg);}}
  .result h2{font:600 24px/1.2 var(--serif); margin:0 0 6px;}
  .result p{color:var(--muted); margin:0 auto 22px; max-width:340px;}
  .mistakes{text-align:left; margin:26px 0 8px;}
  .mistake{padding:12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-bottom:8px;}
  .mistake .q{font:600 15px/1.3 var(--serif);}
  .mistake .a{font-size:13.5px; margin-top:4px;}
  .mistake s{color:var(--bad); opacity:.8;}
  .mistake .a b{color:var(--ok);}
  .mistake .note{display:block; font-size:12.5px; color:var(--muted); margin-top:4px;}

  /* ---------- misc ---------- */
  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:14px; z-index:50;
    max-width:calc(100% - 32px); animation:toastIn .25s ease both; box-shadow:var(--shadow);
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);}}
  .confetti{position:fixed; top:-14px; width:8px; height:14px; border-radius:2px; pointer-events:none; z-index:60; animation:fall 1.9s ease-in forwards;}
  @keyframes fall{to{transform:translateY(112vh) rotate(540deg); opacity:.8;}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="quiz.js"></script>
<script>
'use strict';
/* ======================================================================
   Deutsch Pass: UI controller.
   Pure quiz logic lives in quiz.js (window.Quiz); lesson content in
   data.js, generated from data/*.json by tools/build_miniapp.py.
   ====================================================================== */
const Q = window.Quiz;
const TOTAL = Q.CONFIG.TOTAL_LEKTIONEN;
const PASS_PCT = Math.round(Q.CONFIG.PASS_THRESHOLD * 100);

/* ---------------------------------------------------------------- Telegram */
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
const tgAtLeast = v => IN_TG && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v);
const CLOUD = tgAtLeast('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
const USER_NAME = (IN_TG && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || '';

const haptic = {
  tap(){ if (tgAtLeast('6.1')) tg.HapticFeedback.impactOccurred('light'); },
  ok(){ if (tgAtLeast('6.1')) tg.HapticFeedback.notificationOccurred('success'); },
  bad(){ if (tgAtLeast('6.1')) tg.HapticFeedback.notificationOccurred('error'); },
};

function applyTheme(){
  if (!IN_TG) return;
  document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
  const bg = getComputedStyle(document.body).backgroundColor;
  try { if (tgAtLeast('6.1')) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) {}
}
if (IN_TG) {
  document.body.classList.add('tg');
  tg.ready(); tg.expand();
  applyTheme();
  tg.onEvent('themeChanged', applyTheme);
  if (tgAtLeast('6.1')) tg.BackButton.onClick(() => back());
}

function askConfirm(msg, onYes){
  if (tgAtLeast('6.2')) tg.showConfirm(msg, ok => { if (ok) onYes(); });
  else if (window.confirm(msg)) onYes();
}

/* ---------------------------------------------------------------- storage
   Local copy in localStorage (instant, works outside Telegram) plus an
   optional mirror in Telegram CloudStorage so progress follows the user
   across phone / desktop. CloudStorage values are capped at 4 KB, so the
   review piles are stored per lektion ("r1".."r24") next to "core". */
const LS_KEY = 'dp_v2';
const CLOUD_KEYS = ['core'].concat(Array.from({length: TOTAL}, (_, i) => 'r' + (i + 1)));

function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
// Per-device UI preferences (not synced).
const PREFS = lsGet('dp_prefs') || {};
function savePrefs(){ lsSet('dp_prefs', PREFS); }
function freshDB(){ return {progress:{}, review:{}, streak:{last:null, count:0}, stats:{answered:0, correct:0}, t:{}}; }

function migrateV1(db){
  const p = lsGet('dp_progress_v1'), m = lsGet('dp_missed_v1');
  if (p) for (const n in p) db.progress[n] = {best:p[n].bestScore || 0, passed:!!p[n].passed, attempts:p[n].attempts || 0};
  if (m) for (const n in m) {
    const pile = {};
    (m[n] || []).forEach(id => { pile[id] = Q.CONFIG.REVIEW_CLEAR_STREAK; });
    if (Object.keys(pile).length) db.review[n] = pile;
  }
  return db;
}

let DB = Object.assign(freshDB(), lsGet(LS_KEY) || migrateV1(freshDB()));
const dirty = new Set();
let pushTimer = null;

function commit(keys){
  const now = Date.now();
  for (const k of keys) { DB.t[k] = now; dirty.add(k); }
  lsSet(LS_KEY, DB);
  if (CLOUD) { clearTimeout(pushTimer); pushTimer = setTimeout(pushCloud, 800); }
}
function cloudValue(k){
  return k === 'core'
    ? {progress:DB.progress, streak:DB.streak, stats:DB.stats, t:DB.t.core || 0}
    : {p:DB.review[k.slice(1)] || {}, t:DB.t[k] || 0};
}
function pushCloud(){
  if (!CLOUD) return;
  for (const k of dirty) { try { CLOUD.setItem(k, JSON.stringify(cloudValue(k))); } catch (e) {} }
  dirty.clear();
}
function pullCloud(done){
  if (!CLOUD) return;
  try {
    CLOUD.getItems(CLOUD_KEYS, (err, vals) => {
      if (err || !vals) return;
      let changed = false;
      for (const k of CLOUD_KEYS) {
        let remote = null;
        try { remote = vals[k] ? JSON.parse(vals[k]) : null; } catch (e) {}
        const localT = DB.t[k] || 0, remoteT = (remote && remote.t) || 0;
        if (k === 'core') {
          if (remote) {
            // Lesson progress only ever improves, so merge it field by field.
            for (const n in remote.progress || {}) {
              const a = DB.progress[n] || {best:0, passed:false, attempts:0}, b = remote.progress[n];
              const merged = {best:Math.max(a.best || 0, b.best || 0), passed:!!(a.passed || b.passed), attempts:Math.max(a.attempts || 0, b.attempts || 0)};
              if (JSON.stringify(merged) !== JSON.stringify(DB.progress[n])) { DB.progress[n] = merged; changed = true; }
            }
            if (remoteT > localT) { DB.streak = remote.streak || DB.streak; DB.stats = remote.stats || DB.stats; DB.t.core = remoteT; changed = true; }
          }
          dirty.add('core');
        } else if (remoteT > localT) {
          const n = k.slice(1);
          if (Object.keys(remote.p || {}).length) DB.review[n] = remote.p; else delete DB.review[n];
          DB.t[k] = remoteT; changed = true;
        } else if (localT > remoteT) {
          dirty.add(k);
        }
      }
      lsSet(LS_KEY, DB);
      pushCloud();
      if (changed) done();
    });
  } catch (e) {}
}

function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function progressOf(n){ return DB.progress[n] || {best:0, passed:false, attempts:0}; }
function reviewIds(n){ return Object.keys(DB.review[n] || {}); }
function reviewTotal(){ let s = 0; for (const n in DB.review) s += Object.keys(DB.review[n]).length; return s; }
function passedCount(){ let c = 0; for (let n = 1; n <= TOTAL; n++) if (progressOf(n).passed) c++; return c; }
function trackReview(n, id, correct){
  const pile = Q.updateReview(DB.review[n] || {}, id, correct);
  if (Object.keys(pile).length) DB.review[n] = pile; else delete DB.review[n];
  commit(['r' + n]);
}
function trackAnswer(correct){ DB.stats.answered++; if (correct) DB.stats.correct++; }

/* ---------------------------------------------------------------- content */
const vocabOf = n => (window.VOCAB_DATA || {})[n] || [];
const grammarOf = n => (window.GRAMMAR_DATA || {})[n] || [];
const titleOf = n => (window.LEKTION_TITLES || {})[n] || '';

/* ---------------------------------------------------------------- speech */
const CAN_SPEAK = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function speak(text){
  if (!CAN_SPEAK || !text) return;
  const clean = Q.stripParens(text).replace(/…|\.\.+/g, ' ').trim();
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'de-DE'; u.rate = 0.9;
    const voice = speechSynthesis.getVoices().find(v => /^de([-_]|$)/i.test(v.lang));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if (CAN_SPEAK) { try { speechSynthesis.getVoices(); } catch (e) {} } // warm up the voice list

/* ---------------------------------------------------------------- tiny helpers */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const ICONS = {
  back:'<path d="M15 18l-6-6 6-6"/>',
  chevron:'<path d="M9 18l6-6-6-6"/>',
  cards:'<rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  keyboard:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
  flag:'<path d="M4 22V4"/><path d="M4 4h13l-2 4.5L17 13H4"/>',
  speaker:'<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
};
const icon = name => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const sayBtn = text => CAN_SPEAK && text ? `<button class="say" data-act="speak" data-say="${esc(text)}" aria-label="Listen">${icon('speaker')}</button>` : '';
const backBtn = () => `<button class="iconbtn back" data-act="back" aria-label="Back">${icon('back')}</button>`;

let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#8A2A3C', '#E3C47F', '#2F7D55', '#2F63C9', '#C8374A'];
  for (let i = 0; i < 36; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDelay = Math.random() * .35 + 's';
    el.style.animationDuration = 1.4 + Math.random() + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

/* ---------------------------------------------------------------- state */
const MODES = {
  flash:   {label:'Flashcards',       desc:'Flip, swipe, repeat',     icon:'cards'},
  mc:      {label:'Multiple choice',  desc:'Pick the meaning',        icon:'target'},
  match:   {label:'Matching',         desc:'Pair up 5 words',         icon:'link'},
  type:    {label:'Type it',          desc:'Write the German word',   icon:'keyboard'},
  article: {label:'der · die · das',  desc:'Guess the article',       icon:'tag'},
  review:  {label:'Review',           desc:'Words you missed',        icon:'repeat'},
  grammar: {label:'Grammar',          desc:'Explained when you miss', icon:'book'},
  final:   {label:'Final test',       desc:'',                        icon:'flag'},
};
const EMPTY_MSG = {
  review:'Nothing to review. Words you miss will show up here.',
  grammar:'No grammar quiz for this lektion yet.',
  article:'No nouns with an article in this lektion.',
};

let VIEW = {name:'home'};
let S = null;       // active session
let RESULT = null;  // last finished session

function go(view){ VIEW = view; render(); window.scrollTo(0, 0); }

function back(){
  switch (VIEW.name) {
    case 'lektion': return go({name:'home'});
    case 'result':  return go({name:'lektion', n:RESULT.lektion});
    case 'quiz': case 'type': case 'match': case 'flash': return quitSession();
    default: return go({name:'home'});
  }
}
function quitSession(){
  const leave = () => { const n = S.lektion; S = null; go({name:'lektion', n}); };
  if (S.mode === 'final' && (S.index > 0 || S.answered)) askConfirm("Leave the final test? This attempt won't count.", leave);
  else leave();
}

/* ---------------------------------------------------------------- sessions */
function startMode(n, mode){
  const vocab = vocabOf(n), gq = grammarOf(n);
  let qs = [];
  if (mode === 'match') {
    const round = Q.buildMatchingRound(vocab);
    if (round.left.length < 2) return toast('Not enough words for this yet.');
    S = {mode, lektion:n, round, selL:null, selR:null, done:new Set(), missed:new Set(), wrong:null, mistakes:[]};
    return go({name:'match'});
  }
  if (mode === 'flash') {
    const deck = Q.buildFlashcards(vocab, null, null, reviewIds(n));
    if (!deck.length) return toast('Not enough words for this yet.');
    S = {mode, lektion:n, queue:deck, total:deck.length, known:0, firstTry:0, missedIds:new Set(),
         flipped:false, revealed:false, busy:false, enter:true, reverse:!!PREFS.flashReverse, mistakes:[]};
    return go({name:'flash'});
  }
  switch (mode) {
    case 'mc':      qs = Q.buildVocabMc(vocab); break;
    case 'type':    qs = Q.buildVocabType(vocab); break;
    case 'article': qs = Q.buildArticleDrill(vocab); break;
    case 'review':  qs = Q.buildReviewRound(reviewIds(n), vocab); break;
    case 'grammar': qs = Q.buildGrammarQuiz(gq); break;
    case 'final':   qs = Q.buildFinalTest(vocab, gq); break;
  }
  if (!qs.length) return toast(EMPTY_MSG[mode] || 'Not enough words for this yet.');
  S = {mode, lektion:n, questions:qs, index:0, score:0, answered:false, chosen:null, flipped:false, last:null, mistakes:[]};
  go({name: mode === 'type' ? 'type' : mode === 'flash' ? 'flash' : 'quiz'});
}

function current(){ return S.questions[S.index]; }

function answer(i){
  if (!S || S.answered) return;
  const q = current();
  const ok = i === q.correctIndex;
  S.answered = true; S.chosen = i;
  if (ok) S.score++;
  else S.mistakes.push({
    q: q.kind === 'article' ? q.prompt : q.prompt,
    yours: q.options[i],
    right: q.kind === 'article' ? q.options[q.correctIndex] + ' ' + q.prompt : q.options[q.correctIndex],
    note: q.explanation || '',
  });
  if (q.kind === 'vocab_mc') trackReview(S.lektion, q.id, ok);
  trackAnswer(ok);
  ok ? haptic.ok() : haptic.bad();
  if (q.kind === 'article') speak(q.speak);
  render();
}

function next(){
  if (!S) return;
  S.index++; S.answered = false; S.chosen = null; S.flipped = false; S.last = null;
  if (S.index >= S.questions.length) finish(S.score, S.questions.length);
  else render();
}

function finish(score, total){
  const s = S;
  const pct = total ? score / total : 0;
  let passedNow = false, firstPass = false;
  if (s.mode === 'final') {
    const wasPassed = progressOf(s.lektion).passed;
    const r = Q.recordFinal(DB.progress[s.lektion], pct);
    DB.progress[s.lektion] = r.progress;
    passedNow = r.passedNow; firstPass = passedNow && !wasPassed;
  }
  DB.streak = Q.bumpStreak(DB.streak, today());
  commit(['core']);
  RESULT = {mode:s.mode, lektion:s.lektion, score, total, pct, passedNow, firstPass, mistakes:s.mistakes};
  S = null;
  go({name:'result'});
  if (passedNow) { haptic.ok(); confetti(); }
}

/* typing */
function submitType(giveUp){
  if (!S || S.answered) return;
  const q = current();
  const input = document.getElementById('typeInput');
  const given = giveUp ? '' : (input ? input.value : '');
  if (!giveUp && !given.trim()) { input && input.focus(); return toast('Type your answer first, or tap "I don\'t know".'); }
  const g = Q.gradeTypeAnswer(q, given);
  S.answered = true; S.last = {given, correct:g.correct, exact:g.exact};
  if (g.correct) S.score++;
  else S.mistakes.push({q:q.prompt, yours:given, right:q.answerDisplay});
  trackReview(S.lektion, q.id, g.correct);
  trackAnswer(g.correct);
  g.correct ? haptic.ok() : haptic.bad();
  speak(q.speak);
  render();
}
function insertChar(ch){
  const el = document.getElementById('typeInput');
  if (!el || el.disabled) return;
  const a = el.selectionStart == null ? el.value.length : el.selectionStart;
  const b = el.selectionEnd == null ? el.value.length : el.selectionEnd;
  el.value = el.value.slice(0, a) + ch + el.value.slice(b);
  el.focus(); el.setSelectionRange(a + 1, a + 1);
}

/* matching: tap one side, then the other (either order) */
function matchPick(side, key){
  if (!S || S.wrong || S.done.has(key)) return;
  haptic.tap();
  if (side === 'L') S.selL = S.selL === key ? null : key; else S.selR = S.selR === key ? null : key;
  if (S.selL !== null && S.selR !== null) {
    const l = S.selL, r = S.selR;
    S.selL = S.selR = null;
    if (l === r) {
      S.done.add(l);
      render();
      if (S.done.size === S.round.left.length) setTimeout(finishMatch, 350);
      return;
    }
    S.missed.add(l);
    S.wrong = {l, r};
    haptic.bad();
    render();
    setTimeout(() => { if (S) { S.wrong = null; render(); } }, 450);
    return;
  }
  render();
}
function finishMatch(){
  const total = S.round.left.length;
  for (const item of S.round.left) {
    const ok = !S.missed.has(item.key);
    trackReview(S.lektion, item.id, ok);
    trackAnswer(ok);
    if (!ok) S.mistakes.push({q:item.text, right:S.round.right.find(r => r.matchKey === item.key).text});
  }
  finish(total - S.missed.size, total);
}

/* flashcards
   Flip and swipe animate the existing DOM instead of re-rendering, so the
   CSS transitions actually play. A full render() only happens between cards. */
const REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const MAX_AGAIN = 2; // a card comes back at most twice per round; after that it stays in Review

function flip(){
  if (!S || S.busy) return;
  S.flipped = !S.flipped;
  const card = document.getElementById('card');
  const view = document.querySelector('.view');
  if (card) card.classList.toggle('flipped', S.flipped);
  if (S.flipped && !S.revealed) {
    S.revealed = true;
    if (view) view.classList.add('revealed');
    const hint = document.getElementById('flashHint');
    if (hint) hint.textContent = 'Swipe right if you knew it, left to see it again';
  }
  haptic.tap();
  if (S.flipped && S.reverse) speak(S.queue[0].speak); // German is on the back in reverse mode
}

function flyOut(knew){
  if (!S || S.busy) return;
  if (!S.revealed) { flip(); return; }
  S.busy = true;
  const el = document.getElementById('swipe');
  knew ? haptic.ok() : haptic.tap();
  if (!el || REDUCED_MOTION) return rateFlash(knew);
  el.style.setProperty(knew ? '--yes' : '--no', 1);
  el.classList.add(knew ? 'fly-right' : 'fly-left');
  setTimeout(() => rateFlash(knew), 280);
}

function rateFlash(knew){
  const card = S.queue[0];
  const firstLook = !S.missedIds.has(card.id);
  if (firstLook) {
    // Only the first attempt counts toward the score and the review pile.
    if (knew) S.firstTry++;
    else { S.missedIds.add(card.id); S.mistakes.push({q:card.de, right:card.uz}); }
    trackReview(S.lektion, card.id, knew);
    trackAnswer(knew);
  }
  if (!knew) card.again = (card.again || 0) + 1;
  const done = knew || card.again > MAX_AGAIN;
  if (done) S.known++;
  S.queue = Q.flashAdvance(S.queue, done, 3);
  S.flipped = S.revealed = S.busy = false;
  S.enter = true;
  if (!S.queue.length) return finish(S.firstTry, S.total);
  render();
}

function toggleFlashDirection(){
  if (!S || S.busy) return;
  S.reverse = !S.reverse;
  PREFS.flashReverse = S.reverse; savePrefs();
  S.flipped = S.revealed = false; S.enter = true;
  render();
}

/* swipe gesture on the top card */
let drag = null, swallowClick = false;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('#swipe');
  if (!el || !S || S.busy || e.target.closest('.say') || e.button > 0) return;
  drag = {el, id:e.pointerId, x0:e.clientX, y0:e.clientY, dx:0, moved:false};
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved) {
    if (Math.abs(dx) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // vertical: let the page scroll
    drag.moved = true;
    drag.el.classList.remove('enter', 'settle');
    drag.el.classList.add('dragging');
    try { drag.el.setPointerCapture(e.pointerId); } catch (err) {}
  }
  drag.dx = dx;
  drag.el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  const p = Math.min(Math.abs(dx) / 110, 1);
  drag.el.style.setProperty('--yes', dx > 0 ? p : 0);
  drag.el.style.setProperty('--no', dx < 0 ? p : 0);
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.moved) return; // a plain tap: the click handler flips the card
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
  d.el.classList.remove('dragging');
  if (Math.abs(d.dx) > 100 && S && S.revealed) { d.el.style.transform = ''; return flyOut(d.dx > 0); }
  d.el.classList.add('settle');
  d.el.style.transform = '';
  d.el.style.setProperty('--yes', 0); d.el.style.setProperty('--no', 0);
  if (Math.abs(d.dx) > 100 && S && !S.revealed) flip(); // swiping an unseen card just reveals it
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
document.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); }
}, true);

/* ---------------------------------------------------------------- views */
function viewHome(){
  const passed = passedCount();
  const streak = Q.liveStreak(DB.streak, today());
  const toReview = reviewTotal();
  const cur = Q.currentLektion(DB.progress, TOTAL);
  const curP = progressOf(cur);
  const name = (USER_NAME || 'Deutsch Pass');
  const mrzName = name.toUpperCase().normalize('NFD').replace(/[^A-Z]/g, '<').slice(0, 18);
  const mrz1 = ('P<DEU' + mrzName + '<<A1').padEnd(36, '<').slice(0, 36);
  const mrz2 = (String(passed).padStart(2, '0') + 'X24<<' + String(streak).padStart(3, '0') + 'D<<MOMENTE<A1').padEnd(36, '<').slice(0, 36);

  let map = '';
  for (let m = 1; m <= TOTAL / 3; m++) {
    map += `<div class="module"><div class="module-label">Modul ${m}</div><div class="stamps">`;
    for (let i = 1; i <= 3; i++) {
      const n = (m - 1) * 3 + i, p = progressOf(n), open = Q.isUnlocked(DB.progress, n);
      let cls = 'locked', tag = 'locked';
      if (p.passed) { cls = 'passed'; tag = Math.round(p.best * 100) + '%'; }
      else if (open) { cls = 'open' + (n === cur ? ' current' : ''); tag = p.attempts ? 'best ' + Math.round(p.best * 100) + '%' : 'open'; }
      const rot = ((n * 37) % 15) - 7;
      map += `<button class="stamp ${cls}" style="--rot:${rot}deg" data-act="open" data-n="${n}" aria-label="Lektion ${n}, ${tag}">
        <span class="n">${n}</span><small>${tag}</small></button>`;
    }
    map += '</div></div>';
  }

  return `<div class="view">
    <section class="cover">
      <div class="cover-head">
        <div><div class="cover-kicker">Reisepass · Deutsch</div><div class="cover-title">${esc(USER_NAME ? 'Hallo, ' + USER_NAME + '!' : 'Deutsch Pass')}</div></div>
        <div class="cover-emblem">A1</div>
      </div>
      <div class="stats">
        <div class="stat"><b>${passed}<small style="font-size:14px;opacity:.7">/${TOTAL}</small></b><span>stamps</span></div>
        <div class="stat"><b>${streak}</b><span>day streak</span></div>
        <div class="stat"><b>${toReview}</b><span>to review</span></div>
      </div>
      <div class="cover-bar"><i style="width:${passed / TOTAL * 100}%"></i></div>
      <div class="mrz">${esc(mrz1)}<br>${esc(mrz2)}</div>
    </section>

    <button class="continue" data-act="open" data-n="${cur}">
      <div class="num">${cur}</div>
      <div class="grow">
        <div class="k">${passed === TOTAL ? 'All stamps collected' : curP.attempts ? 'Continue' : 'Up next'}</div>
        <div class="t">${esc(titleOf(cur) || 'Lektion ' + cur)}</div>
        <div class="s">${curP.attempts ? `Best final score ${Math.round(curP.best * 100)}% · need ${PASS_PCT}%` : `${vocabOf(cur).length} words to learn`}</div>
      </div>
      ${icon('chevron')}
    </button>

    ${map}

    <div class="foot">
      ${CLOUD ? 'Progress syncs with your Telegram account.' : 'Progress is saved on this device.'}<br>
      <button class="linkbtn" data-act="reset">Reset progress</button>
    </div>
  </div>`;
}

function viewLektion(n){
  const title = titleOf(n);
  const head = `<div class="top">${backBtn()}<div class="grow"><h1>Lektion ${n}</h1>${title ? `<div class="sub">${esc(title)}</div>` : ''}</div></div>`;
  if (!Q.isUnlocked(DB.progress, n)) {
    return `<div class="view">${head}
      <div class="locked-panel">${icon('lock')}
        <p>Pass the Lektion ${n - 1} final test with ${PASS_PCT}% or more to unlock this one.</p>
        <button class="btn primary" data-act="open" data-n="${n - 1}">Go to Lektion ${n - 1}</button>
      </div></div>`;
  }
  const vocab = vocabOf(n), p = progressOf(n), rv = reviewIds(n).length;
  const nouns = Q.articleNouns(vocab).length, gq = grammarOf(n).length;
  const tile = (mode, extra) => {
    const m = MODES[mode];
    const disabled = (mode === 'review' && !rv) || (mode === 'grammar' && !gq) || (mode === 'article' && !nouns);
    const desc = mode === 'grammar' && !gq ? 'Coming soon' : mode === 'review' && !rv ? 'All clear' : m.desc;
    return `<button class="tile" data-act="start" data-mode="${mode}" data-n="${n}" ${disabled ? 'disabled' : ''}>
      <div class="ic">${icon(m.icon)}</div><div><b>${m.label}</b><br><span>${desc}</span></div>${extra || ''}</button>`;
  };
  const finalCount = Q.CONFIG.FINAL_VOCAB_COUNT + Q.CONFIG.FINAL_GRAMMAR_COUNT;
  return `<div class="view">${head}
    <div class="chips">
      <span class="chip">${vocab.length} words</span>
      ${gq ? `<span class="chip">${gq} grammar questions</span>` : ''}
      ${p.attempts ? `<span class="chip ${p.passed ? 'ok' : ''}">${p.passed ? icon('check') + ' passed' : 'not passed'} · best ${Math.round(p.best * 100)}%</span>` : ''}
    </div>
    <div class="section-label">Practice</div>
    <div class="tiles">
      ${tile('flash')}${tile('mc')}${tile('match')}${tile('type')}${tile('article')}
      ${tile('review', rv ? `<span class="badge">${rv}</span>` : '')}
      ${tile('grammar')}
    </div>
    <div class="section-label">Exam</div>
    <button class="exam" data-act="start" data-mode="final" data-n="${n}">
      ${icon('flag')}
      <div class="grow"><b>Final test</b><span>${finalCount} questions · ${PASS_PCT}% ${n < TOTAL ? 'unlocks Lektion ' + (n + 1) : 'completes the course'}</span></div>
      ${icon('chevron')}
    </button>
  </div>`;
}

function quizTop(){
  const done = S.index + (S.answered ? 1 : 0);
  return `<div class="top">${backBtn()}
    <div class="progress"><div class="bar"><i style="width:${done / S.questions.length * 100}%"></i></div></div>
    <span class="chip">${S.index + 1}/${S.questions.length}</span></div>`;
}

function feedbackDock(ok, title, body){
  return `<div class="dock ${ok ? 'ok' : 'bad'}"><div class="dock-inner">
    <div class="fb-title">${icon(ok ? 'check' : 'x')} ${title}</div>
    ${body ? `<div class="fb-text">${body}</div>` : '<div style="height:8px"></div>'}
    <button class="btn ${ok ? 'ok' : 'bad'}" data-act="next">${S.index + 1 >= S.questions.length ? 'See results' : 'Continue'}</button>
  </div></div>`;
}

function viewQuiz(){
  const q = current();
  let prompt, options;
  if (q.kind === 'article') {
    prompt = `<div class="prompt">${sayBtn(S.answered ? q.speak : '')}
      <div class="lbl">Which article?</div>
      <div class="word"><span class="blank ${S.answered ? q.options[q.correctIndex] : ''}">${S.answered ? esc(q.options[q.correctIndex]) : '&nbsp;'}</span>${esc(q.prompt)}</div>
      <div class="hint">${esc(q.hint)}</div></div>`;
    options = `<div class="articles">${q.options.map((o, i) => {
      let st = '';
      if (S.answered) st = i === q.correctIndex ? 'ok' : i === S.chosen ? 'bad' : 'dim';
      return `<button class="art ${o} ${st}" data-act="answer" data-i="${i}" ${S.answered ? 'disabled' : ''}><span>${o}</span></button>`;
    }).join('')}</div>`;
  } else {
    const lbl = q.kind === 'grammar_mc' ? 'Complete the sentence' : 'What does it mean?';
    prompt = `<div class="prompt">${sayBtn(q.speak)}<div class="lbl">${lbl}</div><div class="word">${esc(q.prompt)}</div></div>`;
    options = q.options.map((o, i) => {
      let st = '';
      if (S.answered) st = i === q.correctIndex ? 'ok' : i === S.chosen ? 'bad' : 'dim';
      return `<button class="opt ${st}" data-act="answer" data-i="${i}" ${S.answered ? 'disabled' : ''}><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`;
    }).join('');
  }
  let dock = '';
  if (S.answered) {
    const ok = S.chosen === q.correctIndex;
    const right = q.kind === 'article' ? `${q.options[q.correctIndex]} ${q.prompt}` : q.options[q.correctIndex];
    const body = ok
      ? (q.kind === 'article' ? `<b>${esc(right)}</b>` : '')
      : `Correct answer: <b>${esc(right)}</b>${q.explanation ? `<span class="note">${esc(q.explanation)}</span>` : ''}`;
    dock = feedbackDock(ok, ok ? pickPraise() : 'Not quite', body);
  }
  return `<div class="view ${S.answered ? 'docked' : ''}">${quizTop()}${prompt}${options}</div>${dock}`;
}

const PRAISE = ['Richtig!', 'Super!', 'Genau!', 'Sehr gut!', 'Toll!', 'Prima!'];
function pickPraise(){ return PRAISE[(S.index + S.score) % PRAISE.length]; }

function viewType(){
  const q = current();
  let dock = '', inputCls = '';
  if (S.answered) {
    const l = S.last;
    inputCls = l.correct ? 'ok' : 'bad';
    if (l.correct && l.exact) dock = feedbackDock(true, pickPraise(), `<b>${esc(q.answerDisplay)}</b>`);
    else if (l.correct) dock = feedbackDock(true, 'Almost perfect', `Watch the spelling: <b>${esc(q.answerDisplay)}</b>`);
    else dock = feedbackDock(false, l.given ? 'Not quite' : 'Now you know', `Correct answer: <b>${esc(q.answerDisplay)}</b>`);
  }
  return `<div class="view ${S.answered ? 'docked' : ''}">${quizTop()}
    <div class="prompt"><div class="lbl">Write in German</div><div class="word">${esc(q.prompt)}</div></div>
    <input id="typeInput" class="type-input ${inputCls}" placeholder="auf Deutsch…" value="${S.answered ? esc(S.last.given) : ''}"
      ${S.answered ? 'disabled' : ''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    ${S.answered ? '' : `
      <div class="keys">${['ä', 'ö', 'ü', 'ß'].map(c => `<button class="key" data-act="ins" data-ch="${c}">${c}</button>`).join('')}</div>
      <p class="hint-line">No need for der/die/das. Small typos are OK.</p>
      <button class="btn primary" data-act="check">Check</button>
      <button class="btn ghost" data-act="giveup">I don't know</button>`}
  </div>${dock}`;
}

function viewMatch(){
  const cls = (side, key) => {
    let c = 'mi ' + (side === 'L' ? 'de' : '');
    if (S.done.has(key)) c += ' done';
    else if (S.wrong && S.wrong[side === 'L' ? 'l' : 'r'] === key) c += ' wrong';
    else if ((side === 'L' ? S.selL : S.selR) === key) c += ' sel';
    return c;
  };
  const left = S.round.left.map(it => `<button class="${cls('L', it.key)}" data-act="pick" data-side="L" data-k="${it.key}" ${S.done.has(it.key) ? 'disabled' : ''}>${esc(it.text)}</button>`).join('');
  const right = S.round.right.map(it => `<button class="${cls('R', it.matchKey)}" data-act="pick" data-side="R" data-k="${it.matchKey}" ${S.done.has(it.matchKey) ? 'disabled' : ''}>${esc(it.text)}</button>`).join('');
  const total = S.round.left.length;
  return `<div class="view"><div class="top">${backBtn()}
    <div class="progress"><div class="bar"><i style="width:${S.done.size / total * 100}%"></i></div></div>
    <span class="chip">${S.done.size}/${total}</span></div>
    <p class="hint-line">Tap a German word and its meaning, in any order.</p>
    <div class="match"><div class="match-col">${left}</div><div class="match-col">${right}</div></div></div>`;
}

/** German word with its article coloured by gender (blue der, red die, green das). */
function germanHtml(c){
  return c.article ? `<span class="g-${c.gender}">${esc(c.article)}</span> ${esc(c.rest)}` : esc(c.de);
}

function viewFlash(){
  const c = S.queue[0];
  const de = `<div class="lbl">Deutsch</div><div class="w">${germanHtml(c)}</div>`;
  const uz = `<div class="lbl">O'zbekcha</div><div class="w">${esc(c.uz)}</div>`;
  const tag = c.again ? '<span class="tag">again</span>' : c.due ? '<span class="tag">review</span>' : '';
  const front = S.reverse ? uz : de + sayBtn(c.speak);
  const back = S.reverse
    ? de + sayBtn(c.speak) + `<div class="sub-w">${esc(c.uz)}</div>`
    : uz + `<div class="sub-w">${germanHtml(c)}</div>` + sayBtn(c.speak);
  const stack = (S.queue[2] ? '<div class="deck-card d2"></div>' : '') + (S.queue[1] ? '<div class="deck-card d1"></div>' : '');
  const enter = S.enter; S.enter = false;
  return `<div class="view docked ${S.revealed ? 'revealed' : ''}"><div class="top">${backBtn()}
    <div class="progress"><div class="bar"><i style="width:${S.known / S.total * 100}%"></i></div></div>
    <span class="chip">${S.queue.length} left</span>
    <button class="dirbtn" data-act="flashdir" aria-label="Switch card direction">${S.reverse ? 'UZ→DE' : 'DE→UZ'}</button></div>
    <div class="deck">${stack}
      <div class="swipe ${enter && !REDUCED_MOTION ? 'enter' : ''}" id="swipe">
        <div class="card ${S.flipped ? 'flipped' : ''}" id="card" data-act="flip">
          <div class="face front">${tag}${front}<div class="flip-cue">tap to flip</div></div>
          <div class="face back">${tag}${back}</div>
        </div>
        <div class="verdict yes">GEWUSST</div><div class="verdict no">NOCHMAL</div>
      </div>
    </div>
    <div class="flash-hint" id="flashHint">${S.revealed ? 'Swipe right if you knew it, left to see it again' : 'Say the answer in your head, then flip'}</div>
  </div>
  <div class="dock flash-dock"><div class="dock-inner"><div class="row2">
    <button class="btn again" data-act="rate" data-knew="0">${icon('repeat')} Again</button>
    <button class="btn ok" data-act="rate" data-knew="1">${icon('check')} Knew it</button>
  </div><div class="kbd-hint">Space flips · ← again · → knew it</div></div></div>`;
}

function viewResult(){
  const r = RESULT, pctInt = Math.round(r.pct * 100), isFinal = r.mode === 'final';
  const good = isFinal ? r.passedNow : r.pct >= Q.CONFIG.PASS_THRESHOLD;
  const circ = 326.73;
  let seal = '', title, msg, primary;
  if (isFinal) {
    seal = `<div class="seal ${r.passedNow ? '' : 'bad'}">${r.passedNow ? 'BESTANDEN' : 'NOCH NICHT'}</div>`;
    if (r.passedNow) {
      title = r.firstPass ? `Stamp ${r.lektion} collected!` : 'Passed again!';
      msg = r.lektion < TOTAL ? `Lektion ${r.lektion + 1} is unlocked.` : 'You finished every lektion. Herzlichen Glückwunsch!';
      primary = r.lektion < TOTAL
        ? `<button class="btn primary" data-act="open" data-n="${r.lektion + 1}">Go to Lektion ${r.lektion + 1}</button>`
        : `<button class="btn primary" data-act="home">Back to passport</button>`;
    } else {
      title = 'Almost there';
      msg = `You need ${PASS_PCT}% to pass. Practise the words below, then try again.`;
      primary = `<button class="btn primary" data-act="retry">Try the final test again</button>`;
    }
  } else {
    title = pctInt === 100 ? 'Perfect round!' : good ? 'Gut gemacht!' : 'Keep practising';
    msg = r.mistakes.length ? 'Missed words were added to your Review list.' : 'No mistakes this time.';
    primary = `<button class="btn primary" data-act="retry">Another round</button>`;
  }
  const mistakes = r.mistakes.length ? `<div class="mistakes"><div class="section-label">Look at these again</div>
    ${r.mistakes.map(m => `<div class="mistake"><div class="q">${esc(m.q)}</div>
      <div class="a">${m.yours ? `<s>${esc(m.yours)}</s> → ` : ''}<b>${esc(m.right)}</b></div>
      ${m.note ? `<span class="note">${esc(m.note)}</span>` : ''}</div>`).join('')}</div>` : '';
  return `<div class="view"><div class="top">${backBtn()}<div class="grow"><h1>${esc(MODES[r.mode].label)}</h1><div class="sub">Lektion ${r.lektion}</div></div></div>
    <div class="result">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/>
          <circle class="val ${good ? 'ok' : ''}" cx="60" cy="60" r="52" style="stroke-dashoffset:${circ * (1 - r.pct)}"/></svg>
        <div class="ring-label"><b>${pctInt}%</b><span>${r.score} of ${r.total}</span></div>
      </div>
      ${seal}
      <h2>${esc(title)}</h2><p>${esc(msg)}</p>
      ${primary}
      <button class="btn" data-act="open" data-n="${r.lektion}">Back to Lektion ${r.lektion}</button>
      ${mistakes}
    </div></div>`;
}

/* ---------------------------------------------------------------- render + events */
function render(){
  const app = document.getElementById('app');
  switch (VIEW.name) {
    case 'lektion': app.innerHTML = viewLektion(VIEW.n); break;
    case 'quiz':    app.innerHTML = viewQuiz(); break;
    case 'type':    app.innerHTML = viewType(); break;
    case 'match':   app.innerHTML = viewMatch(); break;
    case 'flash':   app.innerHTML = viewFlash(); break;
    case 'result':  app.innerHTML = viewResult(); break;
    default:        app.innerHTML = viewHome();
  }
  if (VIEW.name === 'type' && S && !S.answered) {
    const el = document.getElementById('typeInput');
    if (el) el.focus({preventScroll:true});
  }
  if (tgAtLeast('6.1')) VIEW.name === 'home' ? tg.BackButton.hide() : tg.BackButton.show();
}

const ACTIONS = {
  open:   el => { haptic.tap(); go({name:'lektion', n:+el.dataset.n}); },
  home:   () => go({name:'home'}),
  back:   () => back(),
  start:  el => { haptic.tap(); startMode(+el.dataset.n, el.dataset.mode); },
  retry:  () => startMode(RESULT.lektion, RESULT.mode),
  answer: el => answer(+el.dataset.i),
  next:   () => next(),
  speak:  el => speak(el.dataset.say),
  check:  () => submitType(false),
  giveup: () => submitType(true),
  ins:    el => insertChar(el.dataset.ch),
  pick:   el => matchPick(el.dataset.side, +el.dataset.k),
  flip:   () => flip(),
  rate:   el => flyOut(el.dataset.knew === '1'),
  flashdir: () => toggleFlashDirection(),
  reset:  () => askConfirm('Reset all progress? Stamps, streak and review lists will be cleared.', () => {
    DB = freshDB(); commit(CLOUD_KEYS); go({name:'home'}); toast('Progress reset.');
  }),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && VIEW.name !== 'home') { e.preventDefault(); return back(); }
  if (!S) return;
  if (VIEW.name === 'quiz') {
    if (!S.answered && /^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (i < current().options.length) answer(i); }
    else if (S.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
  } else if (VIEW.name === 'type' && e.key === 'Enter') {
    e.preventDefault(); S.answered ? next() : submitType(false);
  } else if (VIEW.name === 'flash') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (e.key === '1' || e.key === 'ArrowLeft') flyOut(false);
    else if (e.key === '2' || e.key === 'ArrowRight') flyOut(true);
  }
});

render();
pullCloud(() => { if (VIEW.name === 'home' || VIEW.name === 'lektion') render(); });
</script>
