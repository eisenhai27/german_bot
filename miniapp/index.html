<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --paper:#EDE7D8;
    --paper-raised:#F7F2E6;
    --ink:#232A3B;
    --ink-soft:#5B6178;
    --brass:#A9772F;
    --brass-soft:#E6D3AE;
    --green:#3F6B52;
    --green-soft:#DCE9DF;
    --red:#9A3B3B;
    --red-soft:#F1DCDC;
    --line: rgba(35,42,59,0.14);
    --shadow: 0 1px 0 rgba(35,42,59,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#171A24;
      --paper-raised:#242938;
      --ink:#EDE7D8;
      --ink-soft:#A7ACC0;
      --brass:#D2A860;
      --brass-soft:#3A311E;
      --green:#8FC7A6;
      --green-soft:#1E2E24;
      --red:#E39B9B;
      --red-soft:#3A2020;
      --line: rgba(237,231,216,0.14);
      --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171A24;
    --paper-raised:#242938;
    --ink:#EDE7D8;
    --ink-soft:#A7ACC0;
    --brass:#D2A860;
    --brass-soft:#3A311E;
    --green:#8FC7A6;
    --green-soft:#1E2E24;
    --red:#E39B9B;
    --red-soft:#3A2020;
    --line: rgba(237,231,216,0.14);
    --shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3,.serif{font-family:'Lora',Georgia,serif;}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    display:flex; align-items:center; gap:12px;
    padding:16px 20px; background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .topbar .back{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--paper-raised); color:var(--ink); font-size:16px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; flex:none;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:600;letter-spacing:0.2px;}
  .topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  .content{flex:1; padding:20px 20px 40px;}

  .intro{margin-bottom:22px;}
  .intro .kicker{color:var(--brass); font-size:13px; font-weight:600; margin-bottom:4px;}
  .intro h2{font-size:26px; margin:0 0 6px; line-height:1.15;}
  .intro p{color:var(--ink-soft); font-size:14px; margin:0; line-height:1.5;}

  .module-block{margin-bottom:22px;}
  .module-block .module-label{
    font-size:12px; color:var(--ink-soft); margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  .module-block .module-label::after{
    content:""; flex:1; height:1px; background:var(--line);
  }
  .stamp-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .stamp{
    aspect-ratio:1; border-radius:50%; border:2px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper-raised); cursor:pointer; position:relative;
    font-family:'Lora',serif; user-select:none;
    transition:transform .12s ease;
  }
  .stamp:active{transform:scale(0.94);}
  .stamp .num{font-size:22px; font-weight:600;}
  .stamp .state{font-size:10px; color:var(--ink-soft); margin-top:2px; font-family:'Work Sans',sans-serif;}
  .stamp.locked{border-style:dashed; opacity:0.55;}
  .stamp.unlocked{border-color:var(--brass); box-shadow:inset 0 0 0 2px var(--brass-soft);}
  .stamp.passed{border-color:var(--green); background:var(--green-soft); color:var(--green);}
  .stamp.passed .num{color:var(--green);}

  .btn{
    display:block; width:100%; text-align:left; padding:15px 16px;
    border-radius:10px; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--ink); font-size:15px; font-weight:500; font-family:inherit;
    cursor:pointer; margin-bottom:10px;
  }
  .btn:active{transform:translateY(1px);}
  .btn .desc{display:block; font-size:12px; color:var(--ink-soft); font-weight:400; margin-top:2px;}
  .btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600;}
  .btn.brass{border-color:var(--brass); box-shadow:inset 0 0 0 1px var(--brass);}
  .btn.disabled{opacity:0.45; pointer-events:none;}

  .badge{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px;
    border:1px solid var(--line); color:var(--ink-soft); margin-bottom:14px;
  }
  .badge.pass{color:var(--green); border-color:var(--green);}

  .locked-note{
    padding:18px; border:1px dashed var(--line); border-radius:12px;
    color:var(--ink-soft); font-size:14px; line-height:1.5; text-align:center;
  }

  .progress-line{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .progress-line .track{flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .progress-line .fill{height:100%; background:var(--brass);}
  .progress-line .count{font-size:12px; color:var(--ink-soft); white-space:nowrap;}

  .prompt-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding:26px 20px; margin-bottom:20px; text-align:center;
  }
  .prompt-card .label{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .prompt-card .word{font-size:24px; font-weight:600; line-height:1.3;}

  .option{
    display:flex; align-items:center; gap:12px;
    width:100%; text-align:left; padding:14px 16px; margin-bottom:9px;
    border-radius:10px; border:1px solid var(--line); background:var(--paper-raised);
    font-size:15px; color:var(--ink); font-family:inherit; cursor:pointer;
  }
  .option .letter{
    width:24px;height:24px;border-radius:50%; border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center; font-size:12px; color:var(--ink-soft); flex:none;
  }
  .option.correct{background:var(--green-soft); border-color:var(--green);}
  .option.correct .letter{border-color:var(--green); color:var(--green);}
  .option.wrong{background:var(--red-soft); border-color:var(--red);}
  .option.wrong .letter{border-color:var(--red); color:var(--red);}
  .option.disabled{pointer-events:none;}

  .explain{
    font-size:13.5px; color:var(--ink-soft); background:var(--paper-raised);
    border-left:3px solid var(--brass); padding:10px 14px; border-radius:6px; margin:6px 0 16px;
    line-height:1.5;
  }

  .type-input{
    width:100%; padding:14px 4px; font-size:20px; font-family:'Lora',serif;
    border:none; border-bottom:2px solid var(--ink); background:transparent; color:var(--ink);
    outline:none; margin-bottom:22px;
  }
  .type-input::placeholder{color:var(--ink-soft); font-style:italic;}

  .flash-wrap{perspective:1200px; margin-bottom:20px;}
  .flash-card{
    position:relative; height:220px; width:100%;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.3,1);
  }
  .flash-card.flipped{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:16px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
  }
  .flash-face.front{background:var(--ink); color:var(--paper); font-size:26px; font-weight:600; font-family:'Lora',serif;}
  .flash-face.back{background:var(--paper-raised); color:var(--ink); font-size:22px; font-weight:600; transform:rotateY(180deg); font-family:'Lora',serif;}
  .flash-hint{text-align:center; font-size:12px; color:var(--ink-soft); margin-bottom:18px;}
  .know-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .know-row .btn{margin-bottom:0; text-align:center;}

  .match-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start;}
  .match-item{
    padding:12px 10px; border-radius:9px; border:1px solid var(--line); background:var(--paper-raised);
    font-size:13.5px; text-align:center; cursor:pointer; margin-bottom:8px; line-height:1.3;
  }
  .match-item.selected{border-color:var(--brass); box-shadow:inset 0 0 0 1.5px var(--brass);}
  .match-item.matched{background:var(--green-soft); border-color:var(--green); color:var(--green); opacity:0.75; pointer-events:none;}
  .match-item.wrong-flash{background:var(--red-soft); border-color:var(--red);}

  .result-wrap{text-align:center; padding:20px 10px 10px;}
  .result-stamp{
    width:110px;height:110px;border-radius:50%; margin:0 auto 18px; border:3px solid var(--green);
    display:flex; align-items:center; justify-content:center; font-size:40px;
    animation:stampIn .4s cubic-bezier(.2,.9,.3,1.2);
  }
  .result-stamp.fail{border-color:var(--red);}
  @keyframes stampIn{from{transform:scale(2) rotate(-8deg); opacity:0;} to{transform:scale(1) rotate(-6deg); opacity:1;}}
  .result-score{font-size:34px; font-weight:700; font-family:'Lora',serif; margin-bottom:6px;}
  .result-msg{color:var(--ink-soft); font-size:14.5px; line-height:1.5; margin-bottom:26px;}

  .footer-note{text-align:center; font-size:11.5px; color:var(--ink-soft); padding:18px 20px 4px;}

  /* ---- motion ---- */
  @keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .content{ animation:viewIn .28s ease; }

  @keyframes matchPop{ 0%{transform:scale(1);} 45%{transform:scale(1.07);} 100%{transform:scale(1);} }
  .match-item.matched{ animation:matchPop .32s ease; }

  @keyframes shakeX{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }
  .match-item.wrong-flash{ animation:shakeX .35s ease; }

  @keyframes stampPress{ 0%{transform:scale(0.9); opacity:0.6;} 60%{transform:scale(1.05);} 100%{transform:scale(1); opacity:1;} }
  .stamp{ animation:stampPress .22s ease; }

  .confetti-piece{
    position:fixed; top:-12px; width:8px; height:14px; border-radius:2px; pointer-events:none; z-index:80;
    animation:confettiFall 1.8s ease-in forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(112vh) rotate(360deg); opacity:0.85; }
  }

  @media (prefers-reduced-motion: reduce){
    .content, .stamp, .match-item.matched, .match-item.wrong-flash, .confetti-piece{ animation:none !important; }
    .flash-card{ transition:none !important; }
    .btn:active, .stamp:active{ transform:none !important; }
  }
</style>
</head>

/* =========================== LOGIC =========================== */
// ---------------------------------------------------------------------------
// Pure quiz-generation / grading logic. No DOM access here so it can be
// unit-tested with plain node before being embedded in the app.
// ---------------------------------------------------------------------------

const PASS_THRESHOLD = 0.8;
const FINAL_VOCAB_COUNT = 10;
const FINAL_GRAMMAR_COUNT = 5;
const PRACTICE_BATCH_SIZE = 10;
const MATCH_ROUND_SIZE = 5;
const FLASHCARD_BATCH_SIZE = 10;
const MISSED_ROUND_SIZE = 10;
const TOTAL_LEKTIONEN = 24;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sample(arr, n) {
  return shuffle(arr).slice(0, Math.min(n, arr.length));
}

function normalizeDe(text) {
  let t = (text || "").trim().toLowerCase();
  t = t.replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss");
  for (const art of ["der ", "die ", "das "]) {
    if (t.startsWith(art)) { t = t.slice(art.length); break; }
  }
  return t.split(/\s+/).filter(Boolean).join(" ");
}

function getVocab(lektion) {
  return VOCAB_DATA[String(lektion)] || [];
}

function getGrammarQuestions(lektion) {
  return GRAMMAR_DATA[String(lektion)] || [];
}

function lektionHasGrammar(lektion) {
  return getGrammarQuestions(lektion).length > 0;
}

function makeMcItem(item, allItems) {
  const seenUz = new Set([item.uz]);
  const candidates = [];
  for (const i of allItems) {
    if (i.id === item.id) continue;
    if (!i.uz || seenUz.has(i.uz)) continue;
    seenUz.add(i.uz);
    candidates.push(i);
  }
  const distractors = sample(candidates, 3);
  const options = shuffle([item.uz, ...distractors.map(d => d.uz)]);
  return {
    kind: "vocab_mc",
    id: item.id,
    prompt: item.de,
    options,
    correctIndex: options.indexOf(item.uz),
  };
}

function buildVocabMc(lektion, n = PRACTICE_BATCH_SIZE, idPool = null) {
  const all = getVocab(lektion);
  let usable = all.filter(i => i.uz);
  if (idPool) usable = usable.filter(i => idPool.has(i.id));
  return sample(usable, n).map(item => makeMcItem(item, all));
}

function buildVocabType(lektion, n = PRACTICE_BATCH_SIZE) {
  const all = getVocab(lektion);
  let pool = all.filter(i => i.pos !== "phrase" && i.uz);
  if (pool.length < 5) pool = all.filter(i => i.uz);
  return sample(pool, n).map(item => ({
    kind: "vocab_type",
    id: item.id,
    prompt: item.uz,
    accepted: [normalizeDe(item.de)],
    answerDisplay: item.de,
  }));
}

function gradeTypeAnswer(question, userText) {
  return normalizeDe(userText) === question.accepted[0];
}

function buildMatchingRound(lektion, size = MATCH_ROUND_SIZE) {
  const all = getVocab(lektion);
  const seenUz = new Set();
  const pool = [];
  for (const i of all) {
    if (i.uz && !seenUz.has(i.uz)) { seenUz.add(i.uz); pool.push(i); }
  }
  const chosen = sample(pool, size);
  const rightOrder = shuffle(chosen.map((_, idx) => idx));
  return {
    kind: "vocab_match",
    left: chosen.map((c, i) => ({ id: c.id, text: c.de, key: i })),
    right: rightOrder.map(idx => ({ text: chosen[idx].uz, matchKey: idx })),
  };
}

function buildFlashcards(lektion, n = FLASHCARD_BATCH_SIZE) {
  const all = getVocab(lektion).filter(i => i.uz);
  return sample(all, n).map(i => ({ kind: "vocab_flash", id: i.id, de: i.de, uz: i.uz }));
}

function buildMissedRound(missedIds, lektion) {
  if (!missedIds || missedIds.length === 0) return [];
  const all = getVocab(lektion);
  const byId = Object.fromEntries(all.map(i => [i.id, i]));
  const ids = sample(missedIds, MISSED_ROUND_SIZE);
  const items = ids.map(id => byId[id]).filter(Boolean);
  return items.map(item => makeMcItem(item, all));
}

function buildGrammarQuiz(lektion, n = null) {
  const qs = getGrammarQuestions(lektion);
  if (qs.length === 0) return [];
  const chosen = sample(qs, n || qs.length);
  return chosen.map(q => ({
    kind: "grammar_mc",
    prompt: q.q,
    options: q.options,
    correctIndex: q.correct,
    explanation: q.explanation,
  }));
}

function buildFinalTest(lektion) {
  const hasGrammar = lektionHasGrammar(lektion);
  let vocabQs, grammarQs;
  if (hasGrammar) {
    vocabQs = buildVocabMc(lektion, FINAL_VOCAB_COUNT);
    grammarQs = buildGrammarQuiz(lektion, FINAL_GRAMMAR_COUNT);
  } else {
    vocabQs = buildVocabMc(lektion, FINAL_VOCAB_COUNT + FINAL_GRAMMAR_COUNT);
    grammarQs = [];
  }
  return shuffle([...vocabQs, ...grammarQs]);
}

if (typeof module !== "undefined") {
  module.exports = {
    PASS_THRESHOLD, TOTAL_LEKTIONEN,
    normalizeDe, getVocab, getGrammarQuestions, lektionHasGrammar,
    buildVocabMc, buildVocabType, gradeTypeAnswer, buildMatchingRound,
    buildFlashcards, buildMissedRound, buildGrammarQuiz, buildFinalTest,
  };
}

/* =========================== APP CONTROLLER =========================== */

const LEKTION_TITLES = {
  1:"Ich heiße Miriam.",2:"Was macht ihr beruflich?",3:"Das ist meine Schwester.",
  4:"Das Bild ist so schön.",5:"Ist das ein Tisch?",6:"Wir haben einen Termin.",
  7:"Sie können super tanzen!",8:"Ich habe leider keine Zeit.",9:"Ich mag Hamburger.",
  10:"Wann kommst du denn an?",11:"Was haben Sie gestern gemacht?",12:"Im Frühling bin ich nach Hamburg gefahren."
};
const MODE_LABELS = {vocab_mc:'Multiple Choice', vocab_missed:'Missed Words', grammar:'Grammar Quiz', final:'Final Test'};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- storage ---------- */
function safeGet(key){ try{ const v = localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function loadProgress(){ return safeGet('dp_progress_v1') || {}; }
function saveProgress(p){ safeSet('dp_progress_v1', p); }
function loadMissed(){ return safeGet('dp_missed_v1') || {}; }
function saveMissed(m){ safeSet('dp_missed_v1', m); }

function getProgress(lektion){
  const p = loadProgress();
  return p[lektion] || {bestScore:0, passed:false, attempts:0};
}
function isUnlocked(lektion){
  if(lektion<=1) return true;
  return getProgress(lektion-1).passed;
}
function recordFinalAttempt(lektion, pct){
  const p = loadProgress();
  const cur = p[lektion] || {bestScore:0, passed:false, attempts:0};
  const passedNow = pct >= PASS_THRESHOLD;
  cur.bestScore = Math.max(cur.bestScore, pct);
  cur.passed = cur.passed || passedNow;
  cur.attempts = (cur.attempts||0)+1;
  p[lektion]=cur;
  saveProgress(p);
  return passedNow;
}
function getMissed(lektion){ const m = loadMissed(); return m[lektion] || []; }
function addMissed(lektion, id){
  const m = loadMissed(); const arr = m[lektion] || [];
  if(!arr.includes(id)) arr.push(id);
  m[lektion]=arr; saveMissed(m);
}
function removeMissed(lektion, id){
  const m = loadMissed(); const arr = (m[lektion]||[]).filter(x=>x!==id);
  m[lektion]=arr; saveMissed(m);
}

/* ---------- state ---------- */
var STATE = {view:'home'};

function goLektion(n){ STATE={view:'lektion', lektion:n}; render(); }
function goVocabMenu(n){ STATE={view:'vocabMenu', lektion:n}; render(); }
function goHome(){ STATE={view:'home'}; render(); }
function goBack(){
  if(STATE.view==='lektion') STATE={view:'home'};
  else if(STATE.view==='vocabMenu') STATE={view:'lektion', lektion:STATE.lektion};
  else if(STATE.view==='result') STATE={view:'lektion', lektion:STATE.payload.lektion};
  else STATE={view:'home'};
  render();
}
function confirmQuit(){
  const s = STATE.session;
  STATE = (s.mode==='grammar'||s.mode==='final')
    ? {view:'lektion', lektion:s.lektion}
    : {view:'vocabMenu', lektion:s.lektion};
  render();
}

function startQuiz(lektion, modeCode){
  let questions, mode;
  if(modeCode==='mc'){ questions=buildVocabMc(lektion); mode='vocab_mc'; }
  else if(modeCode==='grammar'){
    questions=buildGrammarQuiz(lektion); mode='grammar';
    if(questions.length===0){ alert('No grammar quiz for this lektion yet.'); return; }
  }
  else if(modeCode==='missed'){
    const ids=getMissed(lektion); questions=buildMissedRound(ids, lektion); mode='vocab_missed';
    if(questions.length===0){ alert('No missed words yet for this lektion — keep practicing!'); return; }
  }
  else if(modeCode==='final'){ questions=buildFinalTest(lektion); mode='final'; }
  if(!questions || questions.length===0){ alert('Not enough content yet.'); return; }
  STATE = {view:'quiz', session:{mode, lektion, questions, index:0, score:0, total:questions.length, answered:false, chosenIndex:null}};
  render();
}
function answerMc(choiceIdx){
  const s = STATE.session;
  if(s.answered) return;
  const q = s.questions[s.index];
  s.answered = true; s.chosenIndex = choiceIdx;
  const correct = choiceIdx === q.correctIndex;
  if(q.kind==='vocab_mc'){ if(correct) removeMissed(s.lektion, q.id); else addMissed(s.lektion, q.id); }
  if(correct) s.score++;
  render();
}
function nextMc(){
  const s = STATE.session;
  s.index++; s.answered=false; s.chosenIndex=null;
  if(s.index>=s.questions.length){ finishMcSession(); } else { render(); }
}
function finishMcSession(){
  const s = STATE.session;
  const pct = s.total? s.score/s.total : 0;
  let passedNow=false;
  if(s.mode==='final'){ passedNow = recordFinalAttempt(s.lektion, pct); }
  STATE = {view:'result', payload:{lektion:s.lektion, mode:s.mode, score:s.score, total:s.total, pct, passedNow}};
  render();
  if(s.mode==='final' && passedNow) spawnConfetti();
}

function spawnConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#A9772F','#3F6B52','#9A3B3B','#232A3B'];
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100) + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDelay = (Math.random()*0.3) + 's';
    el.style.animationDuration = (1.3 + Math.random()*0.9) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2700);
  }
}

function startType(lektion){
  const questions = buildVocabType(lektion);
  STATE = {view:'type', session:{mode:'vocab_type', lektion, questions, index:0, score:0, total:questions.length, answered:false}};
  render();
}
function submitType(){
  const s = STATE.session;
  if(s.answered) return;
  const q = s.questions[s.index];
  const input = document.getElementById('typeInput');
  const text = input ? input.value : '';
  const correct = gradeTypeAnswer(q, text);
  s.answered = true; s.lastCorrect = correct;
  if(correct){ s.score++; removeMissed(s.lektion, q.id); } else { addMissed(s.lektion, q.id); }
  render();
}
function nextType(){
  const s = STATE.session;
  s.index++; s.answered=false;
  if(s.index>=s.questions.length){
    STATE = {view:'result', payload:{lektion:s.lektion, mode:s.mode, score:s.score, total:s.total, pct:s.total?s.score/s.total:0, passedNow:false}};
  }
  render();
}

function startMatch(lektion){
  const round = buildMatchingRound(lektion);
  if(!round.left.length){ alert('Not enough content yet.'); return; }
  STATE = {view:'match', session:{mode:'vocab_match', lektion, round, selectedLeftKey:null, matched:new Set(), wrongOnce:new Set()}};
  render();
}
function selectLeft(key){
  const s = STATE.session;
  if(s.flashWrong || s.matched.has(key)) return;
  s.selectedLeftKey = key;
  render();
}
function selectRight(matchKey){
  const s = STATE.session;
  if(s.flashWrong || s.selectedLeftKey===null) return;
  if(s.selectedLeftKey === matchKey){
    s.matched.add(s.selectedLeftKey);
    s.selectedLeftKey = null;
    render();
    if(s.matched.size === s.round.left.length){ setTimeout(finishMatch, 280); }
  } else {
    s.wrongOnce.add(s.selectedLeftKey);
    s.flashWrong = {left:s.selectedLeftKey, right:matchKey};
    s.selectedLeftKey = null;
    render();
    setTimeout(()=>{ s.flashWrong=null; render(); }, 320);
  }
}
function finishMatch(){
  const s = STATE.session;
  const total = s.round.left.length;
  const correctCount = total - s.wrongOnce.size;
  for(const item of s.round.left){
    if(s.wrongOnce.has(item.key)) addMissed(s.lektion, item.id); else removeMissed(s.lektion, item.id);
  }
  STATE = {view:'result', payload:{lektion:s.lektion, mode:'vocab_match', score:correctCount, total, pct: total?correctCount/total:0, passedNow:false}};
  render();
}

function startFlash(lektion){
  const questions = buildFlashcards(lektion);
  if(!questions.length){ alert('Not enough content yet.'); return; }
  STATE = {view:'flash', session:{mode:'vocab_flash', lektion, questions, index:0, score:0, total:questions.length, flipped:false}};
  render();
}
function flipCard(){ STATE.session.flipped = true; render(); }
function flashRate(know){
  const s = STATE.session;
  const q = s.questions[s.index];
  if(know){ s.score++; removeMissed(s.lektion, q.id); } else { addMissed(s.lektion, q.id); }
  s.index++; s.flipped=false;
  if(s.index>=s.questions.length){
    STATE = {view:'result', payload:{lektion:s.lektion, mode:s.mode, score:s.score, total:s.total, pct:s.total?s.score/s.total:0, passedNow:false}};
  }
  render();
}

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  let html;
  switch(STATE.view){
    case 'lektion': html = renderLektion(STATE.lektion); break;
    case 'vocabMenu': html = renderVocabMenu(STATE.lektion); break;
    case 'quiz': html = renderQuiz(); break;
    case 'type': html = renderType(); break;
    case 'match': html = renderMatch(); break;
    case 'flash': html = renderFlash(); break;
    case 'result': html = renderResult(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
  if(STATE.view==='type' && !STATE.session.answered){
    const el = document.getElementById('typeInput');
    if(el) el.focus();
  }
}

function renderHome(){
  let body = `
    <div class="topbar"><h1>🛂 Deutsch Pass</h1></div>
    <div class="content">
      <div class="intro">
        <div class="kicker">A1 · Momente</div>
        <h2>Your Lektionen</h2>
        <p>Tap a stamp to practice or test that lektion. Pass the Final Test (80%+) to unlock the next one.</p>
      </div>`;
  for(let m=1;m<=8;m++){
    body += `<div class="module-block"><div class="module-label">Module ${m}</div><div class="stamp-row">`;
    for(let i=0;i<3;i++){
      const n = (m-1)*3+i+1;
      const prog = getProgress(n);
      const unlocked = isUnlocked(n);
      let cls='locked', state='locked';
      if(prog.passed){ cls='passed'; state='passed'; }
      else if(unlocked){ cls='unlocked'; state='open'; }
      body += `<div class="stamp ${cls}" onclick="goLektion(${n})"><div class="num">${n}</div><div class="state">${state}</div></div>`;
    }
    body += `</div></div>`;
  }
  body += `<div class="footer-note">Testing only — no explanations up front. Progress is saved on this device.</div></div>`;
  return body;
}

function renderLektion(n){
  const unlocked = isUnlocked(n);
  const title = LEKTION_TITLES[n] || ('Lektion ' + n);
  let inner;
  if(!unlocked){
    inner = `<div class="locked-note">🔒 Locked.<br>Pass Lektion ${n-1}'s Final Test (80%+) to unlock this one.</div>`;
  } else {
    const prog = getProgress(n);
    const hasG = lektionHasGrammar(n);
    let scoreLine = '';
    if(prog.attempts){
      scoreLine = `<div class="badge ${prog.passed?'pass':''}">${prog.passed?'✓ passed':'not passed yet'} · best ${Math.round(prog.bestScore*100)}%</div>`;
    }
    inner = scoreLine +
      `<button class="btn" onclick="goVocabMenu(${n})">Vocabulary<span class="desc">Flashcards · Multiple choice · Matching · Type the word · Missed words</span></button>` +
      (hasG
        ? `<button class="btn" onclick="startQuiz(${n},'grammar')">Grammar Quiz<span class="desc">Multiple choice, with explanations on misses</span></button>`
        : `<div class="locked-note" style="margin-bottom:14px;">Grammar for this lektion isn't added yet — vocabulary only for now.</div>`) +
      `<button class="btn primary brass" onclick="startQuiz(${n},'final')">🏁 Final Test<span class="desc">Vocab${hasG?' + grammar':''} · 80% to unlock Lektion ${n+1}</span></button>`;
  }
  return `
    <div class="topbar"><div class="back" onclick="goBack()">‹</div><div><h1>Lektion ${n}</h1><div class="sub">${esc(title)}</div></div></div>
    <div class="content">${inner}</div>`;
}

function renderVocabMenu(n){
  const missedCount = getMissed(n).length;
  return `
    <div class="topbar"><div class="back" onclick="goBack()">‹</div><h1>Lektion ${n} · Vocabulary</h1></div>
    <div class="content">
      <button class="btn" onclick="startFlash(${n})">🗂 Flashcards</button>
      <button class="btn" onclick="startQuiz(${n},'mc')">❓ Multiple Choice</button>
      <button class="btn" onclick="startMatch(${n})">🔗 Matching</button>
      <button class="btn" onclick="startType(${n})">⌨️ Type the Word</button>
      <button class="btn ${missedCount?'':'disabled'}" onclick="startQuiz(${n},'missed')">🔁 Missed Words${missedCount?(' ('+missedCount+')'):''}</button>
    </div>`;
}

function renderQuiz(){
  const s = STATE.session;
  const q = s.questions[s.index];
  const pct = Math.round((s.index)/s.questions.length*100);
  const letters=['A','B','C','D'];
  let optionsHtml = '';
  q.options.forEach((opt,i)=>{
    let cls='option';
    if(s.answered){
      if(i===q.correctIndex) cls+=' correct';
      else if(i===s.chosenIndex) cls+=' wrong';
      cls+=' disabled';
    }
    optionsHtml += `<div class="${cls}" onclick="answerMc(${i})"><div class="letter">${letters[i]}</div><div>${esc(opt)}</div></div>`;
  });
  let explain='';
  if(s.answered && q.kind==='grammar_mc' && s.chosenIndex!==q.correctIndex){
    explain = `<div class="explain">${esc(q.explanation)}</div>`;
  }
  const label = MODE_LABELS[s.mode] || s.mode;
  return `
    <div class="topbar"><div class="back" onclick="confirmQuit()">‹</div><h1>${esc(label)}</h1></div>
    <div class="content">
      <div class="progress-line"><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="count">${s.index+1}/${s.questions.length}</div></div>
      <div class="prompt-card"><div class="label">${q.kind==='grammar_mc'?'Complete the sentence':'What does this mean?'}</div><div class="word">${esc(q.prompt)}</div></div>
      ${optionsHtml}
      ${explain}
      ${s.answered ? `<button class="btn primary" onclick="nextMc()">${s.index+1>=s.questions.length?'See results':'Next'}</button>` : ''}
    </div>`;
}

function renderType(){
  const s = STATE.session;
  const q = s.questions[s.index];
  const pct = Math.round((s.index)/s.questions.length*100);
  let feedback = '';
  if(s.answered){
    feedback = s.lastCorrect
      ? `<div class="explain" style="border-left-color:var(--green);">✅ Correct!</div>`
      : `<div class="explain" style="border-left-color:var(--red);">❌ Correct answer: <strong>${esc(q.answerDisplay)}</strong></div>`;
  }
  return `
    <div class="topbar"><div class="back" onclick="confirmQuit()">‹</div><h1>Type the Word</h1></div>
    <div class="content">
      <div class="progress-line"><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="count">${s.index+1}/${s.questions.length}</div></div>
      <div class="prompt-card"><div class="label">Type the German word for</div><div class="word">${esc(q.prompt)}</div></div>
      <input id="typeInput" class="type-input" placeholder="type here…" ${s.answered?'disabled':''} autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitType(); }">
      ${feedback}
      ${s.answered
        ? `<button class="btn primary" onclick="nextType()">${s.index+1>=s.questions.length?'See results':'Next'}</button>`
        : `<button class="btn primary" onclick="submitType()">Check</button>`}
    </div>`;
}

function renderMatch(){
  const s = STATE.session;
  const leftHtml = s.round.left.map(item=>{
    let cls='match-item';
    if(s.matched.has(item.key)) cls+=' matched';
    else if(s.selectedLeftKey===item.key) cls+=' selected';
    else if(s.flashWrong && s.flashWrong.left===item.key) cls+=' wrong-flash';
    return `<div class="${cls}" onclick="selectLeft(${item.key})">${esc(item.text)}</div>`;
  }).join('');
  const rightHtml = s.round.right.map(item=>{
    let cls='match-item';
    if(s.matched.has(item.matchKey)) cls+=' matched';
    else if(s.flashWrong && s.flashWrong.right===item.matchKey) cls+=' wrong-flash';
    return `<div class="${cls}" onclick="selectRight(${item.matchKey})">${esc(item.text)}</div>`;
  }).join('');
  return `
    <div class="topbar"><div class="back" onclick="confirmQuit()">‹</div><h1>Matching</h1></div>
    <div class="content">
      <p style="color:var(--ink-soft); font-size:13px; margin-top:0;">Tap a German word, then tap its meaning.</p>
      <div class="match-cols"><div>${leftHtml}</div><div>${rightHtml}</div></div>
    </div>`;
}

function renderFlash(){
  const s = STATE.session;
  const q = s.questions[s.index];
  return `
    <div class="topbar"><div class="back" onclick="confirmQuit()">‹</div><h1>Flashcards</h1></div>
    <div class="content">
      <div class="progress-line"><div class="track"><div class="fill" style="width:${Math.round(s.index/s.questions.length*100)}%"></div></div><div class="count">${s.index+1}/${s.questions.length}</div></div>
      <div class="flash-wrap" onclick="${s.flipped?'':'flipCard()'}">
        <div class="flash-card ${s.flipped?'flipped':''}">
          <div class="flash-face front">${esc(q.de)}</div>
          <div class="flash-face back">${esc(q.uz)}</div>
        </div>
      </div>
      ${s.flipped
        ? `<div class="know-row"><button class="btn" style="border-color:var(--red);" onclick="flashRate(false)">Missed it</button><button class="btn" style="border-color:var(--green);" onclick="flashRate(true)">Knew it</button></div>`
        : `<div class="flash-hint">Tap the card to reveal the meaning</div>`}
    </div>`;
}

function renderResult(){
  const p = STATE.payload;
  const pct = Math.round(p.pct*100);
  const isFinal = p.mode==='final';
  const passed = isFinal ? p.passedNow : pct>=80;
  let msg;
  if(isFinal){
    msg = p.passedNow
      ? (p.lektion<24 ? `Lektion ${p.lektion+1} is now unlocked.` : `That was the last lektion. Well done.`)
      : `Need 80% to pass and unlock the next lektion. Practice the weak spots and try again anytime.`;
  } else {
    msg = 'Practice round complete.';
  }
  return `
    <div class="topbar"><div class="back" onclick="goBack()">‹</div><h1>Result</h1></div>
    <div class="content">
      <div class="result-wrap">
        <div class="result-stamp ${passed?'':'fail'}">${passed?'✓':'↻'}</div>
        <div class="result-score">${p.score}/${p.total}</div>
        <div class="result-msg">${pct}% — ${esc(msg)}</div>
        <button class="btn primary" onclick="goLektion(${p.lektion})">Back to Lektion ${p.lektion}</button>
        <button class="btn" onclick="goHome()">Lesson map</button>
      </div>
    </div>`;
}

render();

</script>
